<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AOL Underground Proggies — Redirecting</title>
<script>
// Redirect .zip requests to GitHub raw URL
var path = window.location.pathname;
if (path.match(/\.(zip|rar|exe|db|sqlite|txt|md)$/i)) {
  window.location.href = 'https://github.com/ssstonebraker/aolunderground-proggies/raw/main' + path;
} else {
  // For HTML pages not yet deployed, try GitHub blob view
  window.location.href = 'https://github.com/ssstonebraker/aolunderground-proggies/blob/main' + path;
}
</script>
</head>
<body style="background:#1a1a2e;color:#e0e0e0;font-family:sans-serif;text-align:center;padding:60px">
<h1>Redirecting to GitHub...</h1>
<p>If you are not redirected, <a id="link" href="https://github.com/ssstonebraker/aolunderground-proggies" style="color:#4fc3f7">click here</a>.</p>
<script>document.getElementById('link').href = 'https://github.com/ssstonebraker/aolunderground-proggies/raw/main' + window.location.pathname;</script>
</body>
</html>
