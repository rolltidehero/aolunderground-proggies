[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-v --tb=short --ignore=tests/test_every_click.py --ignore=tests/test_walkthrough_page.py --ignore=tests/test_widget_layout.py"
markers = [
    "slow: marks tests that take >5 seconds",
    "integration: marks tests requiring external resources (DB, VM, network)",
]
